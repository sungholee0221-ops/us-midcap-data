name: update-midcap-daily

on:
  schedule:
    - cron: "47 22 * * 1-5"    # 07:47 KST Tue-Sat, after the US close
    - cron: "17 2 * * 2-6"     # backup 11:17 KST
    - cron: "47 6 * * 2-6"     # backup 15:47 KST, before the 17:53 KST chart-ta scan
  workflow_dispatch: {}
  push:                        # Claude sessions trigger a run by committing to main
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
      - "REFRESH"

permissions:
  contents: write

concurrency:
  group: update-midcap-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch
        env:
          OUT_DIR: ${{ runner.temp }}/out
        working-directory: scripts
        run: python fetch_daily.py

      # data branch is a single orphan commit, force-pushed each run: repo size stays flat
      - name: Publish to data branch
        env:
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          cd "$OUT_DIR"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data through $(jq -r .last_date meta.json)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
