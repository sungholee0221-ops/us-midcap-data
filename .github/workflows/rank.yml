name: rank-r1000-approx

on:
  schedule:
    - cron: "13 21 3 * *"     # monthly, 3rd 21:13 UTC (before the 5th history refresh)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/rank_broad.py"
      - ".github/workflows/rank.yml"
      - "REFRESH_RANK"

permissions:
  contents: write

concurrency:
  group: rank-r1000-approx
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rank
        working-directory: scripts
        env:
          LIST_OUT: ../lists/r1000_approx.csv
        run: python rank_broad.py
      # commit the list to main (GITHUB_TOKEN pushes do not trigger other workflows: daily picks it up on its next schedule, history on the 5th)
      - name: Commit list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/r1000_approx.csv
          git diff --cached --quiet && exit 0
          git commit -q -m "Russell 1000 approx list $(date -u +%F)"
          git push
